[project]
name = "overseer"
version = "0.1.0"
description = "Inter-agent relay infrastructure for zeos - multi-agent visibility via MCP"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "<operator>" }
]
dependencies = [
    "mcp>=1.0.0",
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "jinja2",
    "requests>=2.28.0",
    "pyyaml>=6.0",
    "anthropic>=0.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
overseer = "overseer.server:main"
phoenix-daemon = "overseer.phoenix_daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overseer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

{# Agent card partial - renders a single agent #}
<div class="bg-gray-700 rounded-lg p-3 border border-gray-600">
    <div class="flex justify-between items-start mb-2">
        <h3 class="font-semibold text-white">{{ agent.name }}</h3>
        <span class="px-2 py-0.5 rounded text-xs font-medium
            {% if agent.state == 'idle' %}bg-green-600 text-green-100
            {% elif agent.state == 'working' %}bg-yellow-600 text-yellow-100
            {% elif agent.state == 'waiting' %}bg-blue-600 text-blue-100
            {% elif agent.state == 'error' or agent.state == 'stuck' %}bg-red-600 text-red-100
            {% else %}bg-gray-600 text-gray-300{% endif %}">
            {{ agent.state | upper }}
        </span>
    </div>

    <div class="text-sm text-gray-400 space-y-1">
        {% if agent.team_id %}
        <p>Team: <span class="text-gray-300">{{ agent.team_id }}</span></p>
        {% endif %}
        {% if agent.last_heartbeat %}
        <p>Last heartbeat: <span class="text-gray-300">{{ agent.last_heartbeat[:19] }}</span></p>
        {% endif %}
        <p>Confidence: <span class="text-gray-300">{{ agent.confidence }}</span></p>
    </div>

    <div class="mt-3 flex gap-2">
        <button hx-post="/api/agents/{{ agent.name }}/wake"
                hx-swap="none"
                hx-indicator="#wake-indicator-{{ agent.name | replace('-', '_') }}"
                class="px-3 py-1 bg-blue-600 hover:bg-blue-500 rounded text-sm text-white">
            Wake
        </button>
        <span id="wake-indicator-{{ agent.name | replace('-', '_') }}" class="htmx-indicator text-gray-400 text-sm">
            Sending...
        </span>
    </div>
</div>
